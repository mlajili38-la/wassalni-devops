services:
  app:
    build:
      context: .
    image: ${DOCKER_IMAGE:-wassalni}:${APP_VERSION:-local}
    restart: unless-stopped
    # Toutes les valeurs sensibles sont injectees au runtime (jamais dans l'image).
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_VERSION: ${APP_VERSION:-local}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.docker}
      DATABASE_URL: "mysql://${MYSQL_USER:-wassalni}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}@database:3306/${MYSQL_DATABASE:-wassalni}?serverVersion=8.0.32&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wassalni}
      MYSQL_USER: ${MYSQL_USER:-wassalni}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    healthcheck:
      # Connexion TCP : echoue tant que le serveur temporaire d'initialisation tourne.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
