name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  APP_ENV: test
  APP_DEBUG: "1"
  APP_SECRET: ci-only-secret-not-for-production
  DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

jobs:
  quality:
    name: Quality, tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Symfony container
        run: php bin/console lint:container --env=test

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run unit and functional tests
        run: |
          mkdir -p build/reports
          vendor/bin/phpunit --log-junit build/reports/junit.xml

      - name: Archive test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: build/reports/junit.xml
          if-no-files-found: ignore

  container:
    name: Build, deploy-test and publish image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    env:
      APP_SECRET: ci-only-secret-not-for-production
      POSTGRES_PASSWORD: ci-only-database-password
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build versioned image
        run: |
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" \
            --tag "wassalni-ci:${GITHUB_SHA}" .

      - name: Deploy to ephemeral test environment
        run: |
          APP_VERSION="${GITHUB_SHA}" DOCKER_IMAGE=wassalni-ci \
            docker compose up -d --wait --no-build
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 \
            http://localhost:8080/health

      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "wassalni-ci:${GITHUB_SHA}" "${image}:${GITHUB_SHA}"
          docker tag "wassalni-ci:${GITHUB_SHA}" "${image}:latest"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes
