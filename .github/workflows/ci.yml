name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  APP_ENV: test
  APP_DEBUG: "1"
  APP_SECRET: ci-only-secret-not-for-production
  # Base de TEST jetable du job (service MySQL ci-dessous). En env "test", Doctrine
  # ajoute le suffixe "_test" : les tests utilisent la base "wassalni_test".
  DATABASE_URL: "mysql://root:ci-only-root-password@127.0.0.1:3306/wassalni?serverVersion=8.0.32&charset=utf8mb4"
  # Versions figees des scanners de securite (Lot 5, voir docs/SECURITE.md).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.24.3
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  # Miroir officiel de la base Trivy (evite les limites de telechargement de ghcr.io).
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
  # Quality gate : couverture minimale des lignes (en %), voir scripts/check-coverage.php.
  COVERAGE_MIN: "10"

jobs:
  quality:
    name: Quality, tests and dependency audit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer check --diff --show-progress=none

      - name: Static analysis (PHPStan)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - name: Validate Symfony container
        run: php bin/console lint:container --env=test

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Prepare test database (MySQL, migrations)
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate --env=test

      - name: Run unit and integration tests with coverage
        run: |
          mkdir -p build/reports
          vendor/bin/phpunit \
            --log-junit build/reports/junit.xml \
            --testdox-text build/reports/testdox.txt \
            --coverage-clover build/reports/clover.xml \
            --coverage-html build/reports/coverage-html \
            --coverage-text --only-summary-for-coverage-text

      - name: Coverage quality gate
        run: php scripts/check-coverage.php build/reports/clover.xml "${COVERAGE_MIN}"

      - name: Archive test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/
          if-no-files-found: ignore

  security:
    name: Security scans (secrets and dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Secret scan of the whole Git history (Gitleaks)
        # Echoue si un secret non justifie (absent de .gitleaksignore) est trouve. Valeurs masquees (--redact).
        run: |
          mkdir -p build/security
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo" "${GITLEAKS_IMAGE}" git /repo \
            --redact --no-banner --verbose \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format json --report-path /repo/build/security/gitleaks.json

      - name: Dependency vulnerability scan (Trivy on composer.lock)
        # Echoue sur toute vulnerabilite HIGH ou CRITICAL d'une dependance PHP.
        run: |
          docker run --rm -v "${PWD}:/src:ro" -v "${HOME}/.cache/trivy:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY "${TRIVY_IMAGE}" \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src

      - name: Archive security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: build/security/
          if-no-files-found: ignore

  container:
    name: Build, deploy-test and publish image
    runs-on: ubuntu-latest
    needs: [quality, security]
    permissions:
      contents: read
      packages: write
    env:
      APP_SECRET: ci-only-secret-not-for-production
      MYSQL_PASSWORD: ci-only-database-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build versioned image
        run: |
          docker build --pull --build-arg APP_VERSION="${GITHUB_SHA}" \
            --tag "wassalni-ci:${GITHUB_SHA}" .

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Image vulnerability report (Trivy, all severities)
        run: |
          mkdir -p build/security
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" -v "${PWD}/build/security:/out" -e TRIVY_DB_REPOSITORY "${TRIVY_IMAGE}" \
            image --scanners vuln --format json --output /out/trivy-image.json "wassalni-ci:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY "${TRIVY_IMAGE}" \
            image --scanners vuln --severity HIGH,CRITICAL "wassalni-ci:${GITHUB_SHA}" > build/security/trivy-image.txt

      - name: Image security gate (Trivy, HIGH/CRITICAL with available fix)
        # Bloque le deploiement et la publication si une vulnerabilite HIGH/CRITICAL corrigeable est presente.
        # Les vulnerabilites sans correctif publie sont suivies dans docs/SECURITE.md (risque accepte).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY "${TRIVY_IMAGE}" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "wassalni-ci:${GITHUB_SHA}"

      - name: Archive image security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-reports-${{ github.sha }}
          path: build/security/
          if-no-files-found: ignore

      - name: Deploy to ephemeral test environment
        run: |
          APP_VERSION="${GITHUB_SHA}" DOCKER_IMAGE=wassalni-ci \
            docker compose up -d --wait --no-build
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 \
            http://localhost:8080/health

      - name: Verify database migrations
        run: |
          docker compose exec -T app php bin/console doctrine:migrations:up-to-date --env=prod
          docker compose exec -T app php bin/console doctrine:schema:validate --skip-mapping --env=prod

      - name: Smoke test main pages
        run: |
          for path in /health / /connexion /inscription/etape/1; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")
            echo "${path} -> HTTP ${code}"
            test "${code}" = "200"
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color app database

      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "wassalni-ci:${GITHUB_SHA}" "${image}:${GITHUB_SHA}"
          docker tag "wassalni-ci:${GITHUB_SHA}" "${image}:latest"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes
